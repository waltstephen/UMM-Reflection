clean29529_multiround_controller:
  dataset_names:
  - clean29529_multiround_controller
  cache_dir: ${UNIFY_RL_DATA_ROOT}/sft/pixel_cache
  image_transform_args:
    image_stride: 16
    max_image_size: 1024
    min_image_size: 512
  vit_image_transform_args:
    image_stride: 14
    max_image_size: 364
    min_image_size: 224
  is_mandatory: true
  num_used_data:
  - 100
  weight: 4

